name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Explicit preparation
        run: python3 scripts/ci/run.py --prepare
      - name: Offline acceptance
        run: python3 scripts/ci/run.py --lane full --lane minimal --lane release --lane static
