name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical configuration dependency
        uses: actions/checkout@v4
        with:
          repository: lebedenko/holonight-config
          ref: 81b01d3ae8433f3a4b017db2feb588a1ee62b714
          path: holonight-config-dep

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ninja-build libgtest-dev

      - name: Install Qt 6.11
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.11.*'
          arch: linux_gcc_64
          cache: true

      - name: Build and install canonical configuration dependency
        run: |
          cmake -S holonight-config-dep -B holonight-config-dep/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build holonight-config-dep/build --parallel
          sudo cmake --install holonight-config-dep/build --prefix /usr

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
