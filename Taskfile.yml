version: '3'
vars:
  BUILD_DIR: build/debug
  RELEASE_BUILD_DIR: build/release
  HOLONIGHT_CONFIG_BUILD_DIR: build/deps/holonight-config
  HOLONIGHT_CONFIG_PREFIX: '{{default (printf "%s/build/deps/prefix" .TASKFILE_DIR) .HOLONIGHT_DEPENDENCY_PREFIX}}'
  NPROC:
    sh: nproc
  PRESET: '{{default "debug" .PRESET}}'
tasks:
  ci:
    desc: Rehearse all push validation in isolated containers
    cmds:
    - python3 scripts/ci/run.py
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  configure:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset {{.PRESET}}
  configure:release:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset release
  build:config-dependency:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps
  configure:demo:
    desc: Configure (Debug + demo app)
    deps:
    - build:config-dependency
    cmds:
    - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_DEMO=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_CONFIG_PREFIX}}
  build:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset {{.PRESET}}
  build:release:
    desc: build using standalone tooling
    cmds:
    - python3 tooling/workflow.py build --preset release
  test:
    desc: test using standalone tooling
    cmds:
    - python3 tooling/workflow.py test --preset {{.PRESET}}
  lint:
    desc: Run C++ and QML lint
    cmds:
    - task: tidy
    - task: qml-lint
  verify:
    desc: Build + lint + test (pre-commit checklist)
    cmds:
    - task: build
    - task: lint
    - task: test
  colors:generate:
    desc: Regenerate KDE color scheme from palette tokens
    deps:
    - build
    cmds:
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-dark data/holonight-dark.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-light data/holonight-light.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-mocha data/holonight-mocha.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-latte data/holonight-latte.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-storm data/holonight-storm.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-day data/holonight-day.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-ember data/holonight-ember.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-sol data/holonight-sol.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-cyber-d data/holonight-cyber-d.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-cyber-l data/holonight-cyber-l.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-dracula data/holonight-dracula.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-alucard data/holonight-alucard.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-frost data/holonight-frost.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-snow data/holonight-snow.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-canopy data/holonight-canopy.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-glade data/holonight-glade.colors
  install:local:
    desc: Install to ~/.local (no sudo)
    deps:
    - build
    cmds:
    - cmake --install {{.BUILD_DIR}} --prefix ~/.local
  install:local:release:
    desc: Install Release build to ~/.local (for desktop apps)
    deps:
    - build:release
    cmds:
    - cmake --install {{.RELEASE_BUILD_DIR}} --prefix ~/.local
  install:system:
    desc: Install to /usr (requires sudo)
    deps:
    - build:release
    cmds:
    - sudo cmake --install {{.RELEASE_BUILD_DIR}} --prefix /usr
  demo:
    desc: Build and run the visual demo app (from build tree, no platform theme)
    cmds:
    - task: build:config-dependency
    - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_DEMO=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_CONFIG_PREFIX}}
    - cmake --build {{.BUILD_DIR}} -j{{.NPROC}} --target holonight_demo
    - QT_QPA_PLATFORMTHEME=holonight ./{{.BUILD_DIR}}/demo/holonight_demo {{.CLI_ARGS}}
  gallery:
    desc: Build and run the shared controls gallery
    cmds:
    - task: build:config-dependency
    - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CONTROLS_GALLERY=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_CONFIG_PREFIX}}
    - cmake --build {{.BUILD_DIR}} -j{{.NPROC}} --target holonight_controls_gallery
    - QT_QPA_PLATFORMTHEME= ./{{.BUILD_DIR}}/examples/controls-gallery/holonight_controls_gallery {{.CLI_ARGS}}
  demo:install:
    desc: Build, install demo + theme to ~/.local, then run with full platform theme
    cmds:
    - task: build:config-dependency
    - cmake -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_DEMO=ON -DCMAKE_PREFIX_PATH={{.HOLONIGHT_CONFIG_PREFIX}}
    - cmake --build {{.BUILD_DIR}} -j{{.NPROC}}
    - cmake --install {{.BUILD_DIR}} --prefix ~/.local
    - QT_QPA_PLATFORMTHEME=holonight ~/.local/bin/holonight_demo {{.CLI_ARGS}}
  clean:
    desc: Remove build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
  tooling:doctor:
    desc: doctor using standalone tooling
    cmds:
    - python3 tooling/workflow.py doctor
  tooling:refresh:
    desc: refresh using standalone tooling
    cmds:
    - python3 tooling/workflow.py refresh --preset {{default "test" .EDITOR_PRESET}}
  serena:serve:
    desc: Start independent Serena server in codex context
    cmds:
    - serena start-mcp-server --project "{{.TASKFILE_DIR}}" --context codex
  serena:index:
    desc: Explicitly index this module
    cmds:
    - serena project index "{{.TASKFILE_DIR}}"
  deps:
    desc: deps using standalone tooling
    cmds:
    - python3 tooling/workflow.py deps --preset {{.PRESET}}
  configure-tests:
    desc: configure using standalone tooling
    cmds:
    - python3 tooling/workflow.py configure --preset test
  format:
    desc: format using standalone tooling
    cmds:
    - python3 tooling/workflow.py format
  format-check:
    desc: format-check using standalone tooling
    cmds:
    - python3 tooling/workflow.py format-check
  tidy:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope all
  tidy-src:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope src
  tidy-tests:
    desc: tidy using standalone tooling
    cmds:
    - python3 tooling/workflow.py tidy --scope tests
  qml-import-check:
    desc: Check QML runtime import contracts
    cmds:
    - python3 tooling/qml_policy.py
  qmltypes-check:
    desc: Build and verify generated QML metadata
    cmds:
    - task: build
      vars:
        PRESET: test
    - python3 tooling/workflow.py qmltypes-check --preset test
  qml-lint:
    desc: Build and lint QML modules
    cmds:
    - task: build
      vars:
        PRESET: test
    - cmake --build build/test --target all_qmllint
  tooling:qmlls:
    desc: Start configured Qt language server with resolved import paths
    cmds:
    - python3 tooling/workflow.py qmlls
  check:
    desc: Run existing acceptance workflow
    cmds:
    - task: verify
    - task: format-check
    - task: qml-import-check
    - task: qmltypes-check
