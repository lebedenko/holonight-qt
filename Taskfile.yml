version: '3'
vars:
  PRESET: '{{default "dev" .PRESET}}'
  BUILD_DIR: build/{{.PRESET}}
  RELEASE_BUILD_DIR: build/release
tasks:
  license-check:
    desc: Validate REUSE licensing metadata
    cmds:
    - reuse lint
  colors:generate:
    desc: Regenerate KDE color scheme from palette tokens
    deps:
    - build
    cmds:
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-dark data/holonight-dark.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-light data/holonight-light.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-mocha data/holonight-mocha.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-latte data/holonight-latte.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-storm data/holonight-storm.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-day data/holonight-day.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-ember data/holonight-ember.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-sol data/holonight-sol.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-cyber-d data/holonight-cyber-d.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-cyber-l data/holonight-cyber-l.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-dracula data/holonight-dracula.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-alucard data/holonight-alucard.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-frost data/holonight-frost.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-snow data/holonight-snow.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-canopy data/holonight-canopy.colors
    - ./{{.BUILD_DIR}}/tools/generate_holonight_colors --scheme holonight-glade data/holonight-glade.colors
  install:local:
    desc: Install to ~/.local (no sudo)
    deps:
    - build
    cmds:
    - cmake --install {{.BUILD_DIR}} --prefix ~/.local
  install:local:release:
    desc: Install Release build to ~/.local (for desktop apps)
    deps:
    - build:release
    cmds:
    - cmake --install {{.RELEASE_BUILD_DIR}} --prefix ~/.local
  install:system:
    desc: Install to /usr (requires sudo)
    deps:
    - build:release
    cmds:
    - sudo cmake --install {{.RELEASE_BUILD_DIR}} --prefix /usr
  clean:
    desc: Remove build directory
    cmds:
    - rm -rf {{.BUILD_DIR}}
  qml-import-check:
    desc: qml-import-check
    cmds:
    - python3 scripts/check-runtime-imports.py
  qml-lint:
    desc: qml-lint
    cmds:
    - cmake --build build/{{.PRESET}} --target all_qmllint
  check:
    desc: Authoritative container acceptance
    cmds:
    - python3 scripts/ci/container.py check {{.CLI_ARGS}}
  configure:
    desc: configure
    cmds:
    - cmake --preset {{.PRESET}} {{.CLI_ARGS}}
  build:
    desc: build
    cmds:
    - cmake --preset {{.PRESET}}
    - cmake --build --preset {{.PRESET}}
  test:
    desc: test
    cmds:
    - task: build
      vars:
        PRESET: dev
    - ctest --preset dev {{.CLI_ARGS}}
  configure:release:
    desc: configure:release
    cmds:
    - cmake --preset release {{.CLI_ARGS}}
  build:release:
    desc: build:release
    cmds:
    - cmake --preset release
    - cmake --build --preset release
  format:
    desc: Format with the pinned container tools
    cmds:
    - python3 scripts/ci/container.py format
  format-check:
    desc: format-check
    cmds:
    - python3 scripts/quality.py format-check
  tidy:
    desc: tidy
    cmds:
    - python3 scripts/quality.py tidy --build build/{{.PRESET}}
  check:integration:
    desc: Container acceptance plus Release staging and runtime checks
    cmds:
    - python3 scripts/ci/container.py integration {{.CLI_ARGS}}
  qmltypes-check:
    desc: qmltypes-check
    cmds:
    - python3 scripts/quality.py qmltypes --build build/{{.PRESET}} --module Holonight.Core --module Holonight.Controls
      --module Holonight
  demo:
    desc: Build and run the demo
    cmds:
    - cmake --preset dev
    - cmake --build --preset dev --target holonight_demo
    - QT_QPA_PLATFORMTHEME=holonight ./build/dev/demo/holonight_demo {{.CLI_ARGS}}
  gallery:
    desc: Build and run the gallery
    cmds:
    - cmake --preset dev
    - cmake --build --preset dev --target holonight_controls_gallery
    - QT_QPA_PLATFORMTHEME= ./build/dev/examples/controls-gallery/holonight_controls_gallery {{.CLI_ARGS}}
  demo:install:
    desc: Install the demo and theme to ~/.local, then run the demo
    cmds:
    - task: build
      vars:
        PRESET: dev
    - cmake --install build/dev --prefix "$HOME/.local"
    - QT_QPA_PLATFORMTHEME=holonight "$HOME/.local/bin/holonight_demo" {{.CLI_ARGS}}
